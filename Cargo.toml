[package]
name = "light-mock"
version = "0.1.0"
edition = "2024"
description = "Mock & Proxy HTTP intelligent pour Kubernetes"
license = "MIT"
repository = "https://github.com/eoth/light-api-mock"

[dependencies]
# Web framework async
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }

# HTTP client for proxy forwarding
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# JWT validation (Keycloak auth)
jsonwebtoken = "9"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_yaml = "0.9"
serde_json = "1"

# XML/SOAP parsing
quick-xml = "0.37"

# Regex (NFA, compiled once)
regex = "1"

# Fast random (no getrandom dependency)
fastrand = "2"

# Tower middleware (CORS, static files)
tower-http = { version = "0.5", features = ["cors", "fs"] }
tower = "0.4"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID v4 generation
uuid = { version = "1", features = ["v4", "fast-rng"] }

# HTTP types
http = "1"
http-body-util = "0.1"

# Stream adapters (transitive dep, no binary increase)
futures-util = "0.3"

# Lightweight scripting engine (sandboxed, pure Rust)
rhai = { version = "1", features = ["sync"] }

# URL parsing (form_urlencoded for condition extraction)
url = "2"

# Client Kafka (consumer + producer). Optionnel : compile UNIQUEMENT quand la
# feature "messaging-kafka" est active (dep:rdkafka ci-dessous). "cmake-build"
# compile librdkafka (C) depuis les sources via cmake — voir la section
# "Messaging Kafka" de README.md pour les prerequis de build (cmake + toolchain C).
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }

[features]
# Support Kafka fonctionnel (consumer + publisher + journal des messages) :
# NON active par defaut, zero impact sur le binaire/tests tant que non
# activee (dep:rdkafka n'est meme pas telechargee/compilee). Voir la section
# "Messaging Kafka" de README.md.
messaging-kafka = ["dep:rdkafka"]

[profile.release]
opt-level = 3
lto = true
strip = true
