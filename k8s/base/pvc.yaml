apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lightmock-data
  labels:
    app.kubernetes.io/name: lightmock
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
  # No storageClassName: the cluster's default class is used. Set one here if your cluster has no default.
