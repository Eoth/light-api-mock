apiVersion: v1
kind: ConfigMap
metadata:
  name: mimicway-config
  labels:
    app.kubernetes.io/name: mimicway
    app.kubernetes.io/component: config
data:
  DATA_PATH: /data
  STATIC_DIR: /app/static
  PORT: "7342"
  # Every interface: the pod network is the boundary (the binary alone listens on 127.0.0.1 only).
  BIND_ADDRESS: "0.0.0.0"
  RUST_LOG: mimicway=info
  AUTH_ENABLED: "false"
  # KEYCLOAK_URL: "https://keycloak.example.com"
  # KEYCLOAK_REALM: "my-realm"
  # KEYCLOAK_CLIENT_ID: "mimicway"
  # KEYCLOAK_ISSUER: "https://login.example.com/realms/my-realm"   # only when tokens carry another URL
  # SUPER_ADMINS: "alice,bob"
  # Only when the UI and the API are exposed on different hosts (see README.md, "Split UI and API"):
  # API_BASE_URL: "https://mimicway-api.example.com"      # on the instance that serves the UI
  # CORS_ALLOWED_ORIGINS: "https://mimicway.example.com"  # on the instance that serves the API
