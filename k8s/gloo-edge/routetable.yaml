apiVersion: gateway.solo.io/v1
kind: RouteTable
metadata:
  name: mimicway
  labels:
    app.kubernetes.io/name: mimicway
    app.kubernetes.io/component: routing
spec:
  routes:
    # Everything under the host goes to Mimicway, unchanged: its UI calls /api, /assets and /runtime-config.json from
    # the root, so it cannot be moved under a path prefix.
    - matchers:
        - prefix: /
      routeAction:
        single:
          upstream:
            name: mimicway
            namespace: mimicway
