apiVersion: v1
kind: ConfigMap
metadata:
  name: lightmock-config
  namespace: entreprise-tools
  labels:
    app.kubernetes.io/name: lightmock
    app.kubernetes.io/component: config
data:
  DATA_PATH: /data
  STATIC_DIR: /app/static
  PORT: "7342"
  RUST_LOG: light_mock=info
  AUTH_ENABLED: "false"
  # KEYCLOAK_URL: "https://keycloak.example.com"
  # KEYCLOAK_REALM: "entreprise"
  # KEYCLOAK_CLIENT_ID: "lightmock"
  # SUPER_ADMINS: "c95tnak"
  # A definir uniquement si le front est expose sur un domaine/ingress distinct
  # de celui qui route /api (cf k8s/README.md, "Front et back exposes separement") :
  # API_BASE_URL: "https://lightmock-api.example.com"
