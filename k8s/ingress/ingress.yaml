apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mimicway
  labels:
    app.kubernetes.io/name: mimicway
    app.kubernetes.io/component: routing
spec:
  # ingressClassName: nginx   # when your cluster has no default ingress class
  # tls:
  #   - hosts: [mimicway.example.com]
  #     secretName: mimicway-tls
  rules:
    # Mimicway is served from the root of its host: its UI calls /api, /assets and /runtime-config.json.
    - host: mimicway.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mimicway
                port:
                  name: http
