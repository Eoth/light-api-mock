# Every gate a reviewer would otherwise have to run by hand. A pull request merges only when all jobs pass.
# Actions are pinned to commit SHAs (version in the comment): a tag can be moved, a commit cannot. Dependabot proposes
# the updates.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - name: Rust comments are in English
        run: |
          if grep -rniE '^\s*//.*\b(les|pour|avec|une|sont|dans|qui|deja|regle|requete|meme|donc|sinon|aussi|mais|etre|cette|cela|lorsque|puis|chaque)\b' src --include=*.rs; then
            echo "French words in Rust comments: comments are written in English."
            exit 1
          fi
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features tcp-mock --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --features tcp-mock

  kafka:
    name: Rust with the Kafka feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # librdkafka is built from source; on Linux it links libcurl, so it needs the curl headers.
      - run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev
      - run: cargo clippy --features messaging-kafka --all-targets -- -D warnings
      - run: cargo test --features messaging-kafka

  supply-chain:
    name: Supply chain (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (production dependencies of the UI)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (build and test tooling)
        working-directory: frontend
        run: npm audit --audit-level=critical

  frontend:
    name: UI (unit tests, build) and documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - name: Every Markdown link, image and anchor resolves
        run: node scripts/check-doc-links.mjs

  e2e:
    name: End-to-end (real binary, real browser)
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo build
      - working-directory: frontend
        run: npm ci --ignore-scripts && npm run build && npx playwright install --with-deps chromium
      - name: Start lightMock
        run: |
          mkdir -p data
          DATA_PATH=./data STATIC_DIR=./frontend/dist ./target/debug/light-mock > lightmock.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://localhost:7342/api/health && exit 0; sleep 0.2; done
          cat lightmock.log; exit 1
      - working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            frontend/test-results
            lightmock.log

  docker:
    name: Container image (build, vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t lightmock:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lightmock:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  kubernetes:
    name: Kubernetes manifests (render, schema check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz kubeconform
      - name: Render and validate every overlay
        # Custom resources (Gloo Edge) have no published schema: they are rendered, not validated.
        run: |
          for overlay in k8s/ingress k8s/gloo-edge; do
            kubectl kustomize "$overlay" | ./kubeconform -strict -summary -ignore-missing-schemas -
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
